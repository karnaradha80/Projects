name: CI — Syntax & Secrets Check

# Runs on every push and pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  ci-check:
    name: Syntax & Secrets Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install --quiet pyflakes

      - name: Run syntax and secrets check
        run: python ci/check_syntax.py

      - name: Notify on failure (summary)
        if: failure()
        run: |
          echo "CI FAILED — syntax or secret check did not pass."
          echo "Fix the issues above before merging."
