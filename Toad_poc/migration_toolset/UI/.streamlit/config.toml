[server]
port = 8501
address = "0.0.0.0"
headless = true
runOnSave = false
maxUploadSize = 50
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[theme]
base = "light"
primaryColor = "#5EE340"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#000000"
font = "sans serif"

[logger]
level = "warning"
